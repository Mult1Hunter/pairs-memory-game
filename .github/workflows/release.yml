name: Release zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: wp-cli
      - name: Check version numbers agree with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $TAG" pairs-memory-game.php || { echo "::error::plugin header version != $TAG"; exit 1; }
          grep -q "define('PAIRSMG_VERSION', '$TAG')" pairs-memory-game.php || { echo "::error::PAIRSMG_VERSION != $TAG"; exit 1; }
          grep -q "Stable tag: $TAG" readme.txt || { echo "::error::readme.txt stable tag != $TAG"; exit 1; }
      - name: Build zip (honours .distignore)
        run: |
          wp package install wp-cli/dist-archive-command:@stable
          wp dist-archive . ./pairs-memory-game.zip --plugin-dirname=pairs-memory-game
          unzip -l pairs-memory-game.zip | tail -3
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: pairs-memory-game.zip
          generate_release_notes: true
