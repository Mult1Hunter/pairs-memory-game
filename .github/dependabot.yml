# Kept deliberately quiet: one grouped PR per ecosystem, once a month,
# never more than one open at a time. Security advisories still arrive
# immediately through Dependabot alerts regardless of this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary
    groups:
      dev-tools:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
